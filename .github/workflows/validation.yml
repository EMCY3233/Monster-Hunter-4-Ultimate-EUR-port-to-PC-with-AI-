name: Original infrastructure validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  profiles:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build
      - run: ctest --test-dir build -C Debug --output-on-failure
