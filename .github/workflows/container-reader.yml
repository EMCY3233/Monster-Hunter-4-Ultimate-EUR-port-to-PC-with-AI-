name: Container reader validation
on:
  push:
    paths: ['tools/inspection/container-reader/**', 'CMakeLists.txt', '.github/workflows/container-reader.yml']
  pull_request:
    paths: ['tools/inspection/container-reader/**', 'CMakeLists.txt', '.github/workflows/container-reader.yml']
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OpenSSL development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: cmake -S . -B build -DMH4UPC_BUILD_CONTAINER_READER=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSTT_SANITIZERS=${{ runner.os == 'Linux' && matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
      - run: cmake --build build --config ${{ matrix.build_type }}
      - run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
